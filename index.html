	<style>
		html:not(.css-ready) #wrapper { visibility: hidden; }
			.modal-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background: rgba(0, 0, 0, 0.28);
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 10000;
				opacity: 0;
				visibility: hidden;
				transition: opacity 0.3s ease, visibility 0.3s ease;
			}

			.modal-overlay.active {
				opacity: 1;
				visibility: visible;
			}
			.glass-card {
				width: 240px;
				height: 360px;
				background: rgba(255, 255, 255, 0.4);
				backdrop-filter: blur(32px);
				-webkit-backdrop-filter: blur(32px);
				border-radius: 20px;
				border: 1px solid rgba(255, 255, 255, 0.3);
				box-shadow:
					0 8px 32px rgba(0, 0, 0, 0.1),
					inset 0 1px 0 rgba(255, 255, 255, 0.5),
					inset 0 -1px 0 rgba(255, 255, 255, 0.1),
					inset 0 0 10px 5px rgba(255, 255, 255, 0.5);
				position: relative;
				overflow: hidden;
				color: #2c3e50;
				padding: 24px 18px;
				box-sizing: border-box;
				display: flex;
				flex-direction: column;
				transform: scale(0.92) translateY(12px);
				transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
			}

			.modal-overlay.active .glass-card {
				transform: scale(1) translateY(0);
			}

			.glass-card::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 1px;
				background: linear-gradient(
					90deg,
					transparent,
					rgba(255, 255, 255, 0.8),
					transparent
				);
				pointer-events: none;
			}

			.glass-card::after {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 1px;
				height: 100%;
				background: linear-gradient(
					180deg,
					rgba(255, 255, 255, 0.8),
					transparent,
					rgba(255, 255, 255, 0.3)
				);
				pointer-events: none;
			}
			.glass-close-btn {
				position: absolute;
				top: 12px;
				right: 12px;
				width: 28px;
				height: 28px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				color: #333;
				font-size: 13px;
				border: none;
				background: rgba(255, 255, 255, 0.45);
				transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
				z-index: 10;
				line-height: 1;
				padding: 0;
			}
			.glass-close-btn:hover {
				background: #5CA0FE !important;
				color: #ffffff !important;
				transform: rotate(90deg);
			}

			.glass-card-header {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-top: 4px;
				margin-bottom: 14px;
			}

			.glass-card-header i {
				color: #5CA0FE;
				font-size: 1.15em;
			}

			.glass-card-header h3 {
				margin: 0;
				font-size: 1.05em;
				font-weight: 700;
				color: #1a252f;
				letter-spacing: 0.05em;
			}

			.glass-card-body {
				font-size: 0.8em;
				line-height: 1.6em;
				color: #34495e;
				flex: 1;
				overflow-y: auto;
			}

			.glass-card-body p {
				margin: 0 0 10px 0;
			}

			.glass-badge {
				display: inline-block;
				background: rgba(92, 160, 254, 0.2);
				color: #155bc0;
				padding: 2px 8px;
				border-radius: 6px;
				font-size: 0.85em;
				font-weight: 600;
				margin-bottom: 10px;
			}

			.about-slogan {
				font-family: "Comfortaa", "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
				font-size: 1.05em;
				font-weight: 700;
				color: #1a252f;
				letter-spacing: 0.04em;
				margin-top: 14px !important;
				margin-bottom: 6px !important;
			}

			.about-sub {
				font-size: 0.78em;
				line-height: 1.7em;
				color: #34495e;
				opacity: 0.9;
			}

			.about-email {
				margin-top: 12px !important;
				font-size: 0.8em;
				color: #34495e;
			}

			.about-email a {
				color: #155bc0;
				border-bottom: dotted 1px;
				text-decoration: none;
				word-break: break-all;
				transition: color 0.2s ease-in-out, border-color 0.2s ease-in-out;
			}

			.about-email a:hover {
				color: #5CA0FE;
				border-color: transparent;
			}

			.notbyai-badge {
				display: inline-block;
				margin-top: 14px;
				border: none !important;
				line-height: 0;
				opacity: 0.85;
				transition: opacity 0.25s ease, transform 0.2s ease;
			}

			.notbyai-badge:hover {
				opacity: 1;
				transform: translateY(-1px);
				border-color: transparent !important;
			}

			.notbyai-badge img {
				display: block;
				width: 110px;
				height: auto;
				border-radius: 4px;
			}

			.un-br {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #eee;
				color: #333;
				text-align: center;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 24px;
				box-sizing: border-box;
				z-index: 99999;
			}
			.un-br .un-br_sf {
				font-size: 5em;
				line-height: 1;
				color: #999;
				margin: 0 0 0.15em 0;
			}
			.un-br h1 {
				margin: 0.25em 0;
				font-weight: 700;
			}
			.un-br p {
				opacity: 0.7;
				margin: 0.6em 0 0 0;
			}
			@media (prefers-color-scheme: dark) {
				.un-br {
					background-color: #1f1f1f;
					color: #fff;
				}
				.un-br .un-br_sf {
					color: #ccc;
				}
			}
	</style>
	<script>
		document.documentElement.classList.add('css-ready');

<body>

	<script>
		(function () {
			var root = document.documentElement;
			if (root.classList.contains('css-ready')) return;
			setTimeout(function () { root.classList.add('css-ready'); }, 2500);
		})();
	</script>

	<script>
		window.ontouchmove = function () { return false; }
		window.onorientationchange = function () { document.body.scrollTop = 0; }

		const modal = document.getElementById('about-modal');
		const openBtn = document.getElementById('btn-about');
		const closeBtn = document.getElementById('modal-close-btn');

		if (openBtn && modal && closeBtn) {
			openBtn.addEventListener('click', function (e) {
				e.preventDefault();
				modal.classList.add('active');
			});

			closeBtn.addEventListener('click', function (e) {
				e.stopPropagation();
				modal.classList.remove('active');
			});

			modal.addEventListener('click', function (e) {
				if (e.target === modal) {
					modal.classList.remove('active');
				}
			});

			document.addEventListener('keydown', function (e) {
				if (e.key === 'Escape') {
					modal.classList.remove('active');
				}
			});
		}
	</script>

	<script type="text/javascript">
	(function () {
		var root = document.documentElement;
		if (root.classList.contains('css-ready')) return;

		var browser = null;

		if (navigator.userAgentData && navigator.userAgentData.brands) {
			var brands = navigator.userAgentData.brands;
			for (var i = 0; i < brands.length; i++) {
				var brand = brands[i];
				var version = parseFloat(brand.version || '0');

				if (brand.brand === 'Google Chrome' || brand.brand === 'Chrome' || brand.brand === 'Chromium') {
					if (!browser || browser.name !== 'chrome') {
						browser = { name: 'chrome', version: version };
					}
				} else if (brand.brand === 'Edg') {
					if (!browser || browser.name !== 'edge') {
						browser = { name: 'edge', version: version };
					}
				} else if (brand.brand === 'Opera') {
					if (!browser || browser.name !== 'opera') {
						browser = { name: 'opera', version: version };
					}
				}
			}
		}

		if (!browser) {
			var ua = navigator.userAgent || '';
			var firefoxMatch = ua.match(/Firefox/(d+)/);
			if (firefoxMatch) {
				var firefoxVersion = parseInt(firefoxMatch[1], 10);
				if (firefoxVersion >= 103) {
					browser = { name: 'firefox', version: firefoxVersion };
				}
			}

			if (!browser) {
				var safariMatch = ua.match(/Version/(d+.d+)/);
				if (safariMatch) {
					var safariVersion = parseFloat(safariMatch[1]);
					if (safariVersion >= 16.4) {
						browser = { name: 'safari', version: safariVersion };
					}
				}
			}
		}

		var supported = !!browser && (
			(browser.name === 'chrome' && browser.version >= 85) ||
			(browser.name === 'edge' && browser.version >= 121) ||
			(browser.name === 'opera' && browser.version >= 71) ||
			(browser.name === 'firefox' && browser.version >= 103) ||
			(browser.name === 'safari' && browser.version >= 16.4)
		);

		if (!supported) {
			document.body.innerHTML += '<div class="un-br"><h1 class="un-br_sf">{ ᗜ˰ᗜ }</h1> <h1>浏览器不受支持</h1><p>您当前使用的浏览器不受支持，请更新你的浏览器。</p></div>';
		}
	})();
</script>
