<!DOCTYPE HTML>
<html lang="zh-cn">

<head>
	<title>51chifun - 个人主页</title>
	<meta charset="utf-8" />
	<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name='description' content='51chifun，个人主页。'>
	<meta name='keywords' content='51chifun,个人主页'>
	<link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon" />
	<link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
	<link rel="preconnect" href="https://www.51chifun.de" crossorigin />
	<link rel="preload" as="style" href="assets/css/main.css" />
	<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/webfonts/fa-solid-900.woff2" />
	<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/webfonts/fa-regular-400.woff2" />
	<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/webfonts/fa-brands-400.woff2" />
	<link rel="preload" as="image" href="assets/css/images/bg.webp" fetchpriority="high" />
	<link rel="stylesheet" href="assets/css/main.css" media="print" onload="this.media='all';document.getElementById('wrapper').style.opacity='1'" />
	<link rel="stylesheet" href="assets/css/all.min.css" media="print" onload="this.media='all'" />
	<noscript><link rel="stylesheet" href="assets/css/main.css" /><link rel="stylesheet" href="assets/css/all.min.css" /></noscript>
	<style>
		#wrapper { opacity: 0; transition: opacity 0.3s ease; }
			[class^="fa-"], [class*=" fa-"]::before {
				font-family: "Font Awesome 5 Brands", "Font Awesome 5 Pro", "Font Awesome 5 Free", "Font Awesome 6 Brands", "Font Awesome 6 Pro", "Font Awesome 6 Free", sans-serif !important;
				font-weight: 900 !important;
			}
			.modal-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background: rgba(0, 0, 0, 0.28);
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 10000;
				opacity: 0;
				visibility: hidden;
				transition: opacity 0.3s ease, visibility 0.3s ease;
			}

			.modal-overlay.active {
				opacity: 1;
				visibility: visible;
			}
			.glass-card {
				width: 240px;
				height: 360px;
				background: rgba(255, 255, 255, 0.4);
				backdrop-filter: blur(32px);
				-webkit-backdrop-filter: blur(32px);
				border-radius: 20px;
				border: 1px solid rgba(255, 255, 255, 0.3);
				box-shadow: 
					0 8px 32px rgba(0, 0, 0, 0.1),
					inset 0 1px 0 rgba(255, 255, 255, 0.5),
					inset 0 -1px 0 rgba(255, 255, 255, 0.1),
					inset 0 0 10px 5px rgba(255, 255, 255, 0.5);
				position: relative;
				overflow: hidden;
				color: #2c3e50;
				padding: 24px 18px;
				box-sizing: border-box;
				display: flex;
				flex-direction: column;
				transform: scale(0.92) translateY(12px);
				transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
			}

			.modal-overlay.active .glass-card {
				transform: scale(1) translateY(0);
			}

			.glass-card::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 1px;
				background: linear-gradient(
					90deg,
					transparent,
					rgba(255, 255, 255, 0.8),
					transparent
				);
				pointer-events: none;
			}

			.glass-card::after {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 1px;
				height: 100%;
				background: linear-gradient(
					180deg,
					rgba(255, 255, 255, 0.8),
					transparent,
					rgba(255, 255, 255, 0.3)
				);
				pointer-events: none;
			}
			.glass-close-btn {
				position: absolute;
				top: 12px;
				right: 12px;
				width: 28px;
				height: 28px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				color: #333;
				font-size: 13px;
				border: none;
				background: rgba(255, 255, 255, 0.45);
				transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
				z-index: 10;
				line-height: 1;
				padding: 0;
			}
			.glass-close-btn:hover {
				background: #5CA0FE !important;
				color: #ffffff !important;
				transform: rotate(90deg);
			}

			.glass-card-header {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-top: 4px;
				margin-bottom: 14px;
			}

			.glass-card-header i {
				color: #5CA0FE;
				font-size: 1.15em;
			}

			.glass-card-header h3 {
				margin: 0;
				font-size: 1.05em;
				font-weight: 700;
				color: #1a252f;
				letter-spacing: 0.05em;
			}

			.glass-card-body {
				font-size: 0.8em;
				line-height: 1.6em;
				color: #34495e;
				flex: 1;
				overflow-y: auto;
			}

			.glass-card-body p {
				margin: 0 0 10px 0;
			}

			.glass-badge {
				display: inline-block;
				background: rgba(92, 160, 254, 0.2);
				color: #155bc0;
				padding: 2px 8px;
				border-radius: 6px;
				font-size: 0.85em;
				font-weight: 600;
				margin-bottom: 10px;
			}
	</style>
</head>

<body class="is-preload">
	<div id="wrapper">
		<div id="bg"></div>
		<div id="overlay"></div>
		<div id="main">

			<!-- Header -->
			<header id="header">
				<h1>51chifun.</h1>
				<p>&nbsp;&bull;&nbsp; 我的个人主页 &nbsp;&bull;&nbsp; 建议收藏 &nbsp;&bull;&nbsp; 一个初中生 &nbsp;&bull;&nbsp;</p>
				<nav>
					<ul>
						<li><a href="https://blog.51chifun.de/" target="_blank" rel="noopener" class="icon fa-solid fa-blog" data-tooltip="博客"><span class="label">博客</span></a></li>
						<li><a href="https://github.com/51chifun" target="_blank" rel="noopener" class="icon fa-brands fa-github" data-tooltip="github"><span class="label">github</span></a></li>
						<li><a href="mailto:blog51chifun@icloud.com" class="icon fa-solid fa-envelope" data-tooltip="给我发邮件"><span class="label">Email</span></a></li>
						<li><a href="javascript:void(0);" id="btn-about" class="icon fa-solid fa-info" data-tooltip="关于"><span class="label">关于</span></a></li>
					</ul>
				</nav>
			</header>

		</div>
	</div>

	<div id="about-modal" class="modal-overlay">
		<div class="glass-card">
			<button class="glass-close-btn" id="modal-close-btn" title="关闭">
				<i class="fa-solid fa-xmark"></i>
			</button>
			<div class="glass-card-header">
				<i class="fa-solid fa-circle-info"></i>
				<h3>关于</h3>
			</div>
			<div class="glass-card-body">
				<span class="glass-badge">51chifun</span>
				<p>欢迎来到我的个人主页！</p>
				<p>持续记录学习、编程与日常折腾。</p>
				<p style="font-size: 0.9em; opacity: 0.75; margin-top: 14px;">点击右上角叉子按钮或外部遮罩可关闭此卡片。</p>
			</div>
		</div>
	</div>

	<script>
		window.onload = function () { document.body.classList.remove('is-preload'); }
		window.ontouchmove = function () { return false; }
		window.onorientationchange = function () { document.body.scrollTop = 0; }

		// Defer unused Font Awesome CSS
		setTimeout(function() {
			var faCss = document.querySelector('link[href="assets/css/all.min.css"]');
			if (faCss) faCss.media = 'all';
		}, 2000);

		const modal = document.getElementById('about-modal');
		const openBtn = document.getElementById('btn-about');
		const closeBtn = document.getElementById('modal-close-btn');

		if (openBtn && modal && closeBtn) {
			openBtn.addEventListener('click', function (e) {
				e.preventDefault();
				modal.classList.add('active');
			});

			closeBtn.addEventListener('click', function (e) {
				e.stopPropagation();
				modal.classList.remove('active');
			});

			modal.addEventListener('click', function (e) {
				if (e.target === modal) {
					modal.classList.remove('active');
				}
			});

			document.addEventListener('keydown', function (e) {
				if (e.key === 'Escape') {
					modal.classList.remove('active');
				}
			});
		}
	</script>
	
</body>

</html>
